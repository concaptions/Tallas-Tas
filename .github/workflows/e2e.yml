name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (demo + live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Live mode (docs/runbook.md, "Playwright live mode"): the four repository secrets, same names.
      # A fork PR has no secrets, so every value is empty, @tas/env treats empty as unset, and the run
      # is demo mode with the live tests reported as skipped — never a half-configured run.
      CLERK_PUBLISHABLE_KEY_TEST: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY_TEST: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_E2E_USER_PASSWORD: ${{ secrets.CLERK_E2E_USER_PASSWORD }}
      DATABASE_URL_E2E: ${{ secrets.DATABASE_URL_E2E }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Live mode must be fully configured on this ref
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          for name in CLERK_PUBLISHABLE_KEY_TEST CLERK_SECRET_KEY_TEST CLERK_E2E_USER_PASSWORD DATABASE_URL_E2E; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set; add it under Settings → Secrets and variables → Actions"; exit 1; fi
          done
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
